name: Lean verification
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build-args: Main
      - name: Reject sorry / admit
        run: |
          ! grep -rn --include=*.lean -E '\b(sorry|admit)\b' . || (echo "sorry/admit found" && exit 1)
      - name: Axiom audit
        run: |
          lake env lean Main.lean 2>&1 | tee axioms.txt
          grep "'Erdos834" axioms.txt || true
