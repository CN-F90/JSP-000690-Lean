name: Lean verification (Main + Audit)

# Self-contained reproducible build. The earlier `leanprover/lean-action@v1`
# workflow aborted with "No lake-manifest.json found" before elaborating any
# proof source, so the badge was red and meaningless. This workflow instead
# installs elan, resolves the pinned toolchain, runs `lake update` and builds
# the module itself.
#
# A green run proves: the pinned toolchain resolves, mathlib v4.34.0 builds,
# the module compiles, the target theorem depends only on Lean's standard
# foundations, and no sorry/admit/axiom/unsafe occurs in code (comments
# excluded).

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install elan and resolve the pinned toolchain
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          rm -f elan-init.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Show versions
        run: |
          which lake && lake --version
          lean --version
          echo "lean-toolchain: $(cat lean-toolchain)"

      - name: Cache lake artifacts (best effort)
        uses: actions/cache@v4
        with:
          path: |
            .lake/build
            lake-packages
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain','lakefile.toml') }}
          restore-keys: |
            lake-${{ runner.os }}-

      - name: lake update (fetch mathlib at the pinned commit)
        run: lake update

      - name: mathlib precompiled olean cache (best effort)
        continue-on-error: true
        run: lake exe cache get || echo "cache unavailable - will compile from source"

      - name: lake build
        run: lake build Main Audit

      - name: Axiom audit (#print axioms)
        run: |
          OUT=$(lake env lean Main.lean 2>&1)
          echo "$OUT"
          if echo "$OUT" | grep -q 'sorryAx'; then
            echo "ERROR: 'sorryAx' present - a 'sorry' remains in the proof."
            exit 1
          fi
          EXPECTED="'Erdos834.erdos_834_exists' depends on axioms: [propext, Classical.choice, Quot.sound]"
          if ! echo "$OUT" | grep -qF "$EXPECTED"; then
            echo "ERROR: unexpected axiom set for Erdos834.erdos_834_exists."
            exit 1
          fi
          EXPECTED="'Erdos834.H834_chi3' depends on axioms: [propext, Classical.choice, Quot.sound]"
          if ! echo "$OUT" | grep -qF "$EXPECTED"; then
            echo "ERROR: unexpected axiom set for Erdos834.H834_chi3."
            exit 1
          fi

          echo "OK: axiom audit passed for all target theorems."

      - name: Axiom audit — independent bridge (Audit.lean)
        run: |
          OUT=$(lake env lean Audit.lean 2>&1)
          echo "$OUT"
          if echo "$OUT" | grep -q 'sorryAx'; then
            echo "ERROR: 'sorryAx' present in Audit.lean."
            exit 1
          fi
          EXPECTED="'Audit834.submitted_theorem_yields_intended' depends on axioms: [propext, Classical.choice, Quot.sound]"
          if ! echo "$OUT" | grep -qF "$EXPECTED"; then
            echo "ERROR: unexpected axiom set for Audit834.submitted_theorem_yields_intended."
            exit 1
          fi
          EXPECTED="'Audit834.audit_not_twoCol' depends on axioms: [propext, Classical.choice, Quot.sound]"
          if ! echo "$OUT" | grep -qF "$EXPECTED"; then
            echo "ERROR: unexpected axiom set for Audit834.audit_not_twoCol."
            exit 1
          fi
          echo "OK: axiom audit passed for the independent bridge."

      - name: Reject forbidden placeholders (sorry / admit / axiom / unsafe)
        run: python3 scripts/check_no_placeholders.py

      - name: Confirm the artifact actually compiled (olean present)
        run: |
          f=$(find .lake/build -path "*/lib/lean/Main.olean" | head -1)
          g=$(find .lake/build -path "*/lib/lean/Audit.olean" | head -1)
          if [ -z "$g" ] || [ ! -s "$g" ]; then
            echo "ERROR: Audit.olean NOT found under .lake/build/lib/lean/."
            exit 1
          fi
          echo "OK: $g built."

          if [ -n "$f" ] && [ -s "$f" ]; then
            echo "OK: $f built ($(stat -c%s "$f") bytes)."
          else
            echo "ERROR: Main.olean NOT found under .lake/build/lib/lean/."
            find .lake/build -name '*.olean' | sort || true
            exit 1
          fi
